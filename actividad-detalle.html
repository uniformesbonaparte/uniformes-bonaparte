<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de Actividad - Bonaparte</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #0b3a73 0%, #1e5a9e 100%);
      color: white;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
    }

    .btn-volver {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-volver:hover {
      background: rgba(255,255,255,0.3);
    }

    .content {
      padding: 32px;
    }

    .badge-tipo {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .badge-tipo.corte {
      background: #dcfce7;
      color: #166534;
    }

    .badge-tipo.confeccion {
      background: #f3e8ff;
      color: #6b21a8;
    }

    .info-pedido {
      background: #f9fafb;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      border-left: 4px solid #667eea;
    }

    .info-label {
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 16px;
      color: #0f172a;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .section {
      background: #f0fdf4;
      border-left: 4px solid #10b981;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .section.confeccion {
      background: #faf5ff;
      border-left-color: #8b5cf6;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #0b3a73;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tela-card {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 2px solid #d1fae5;
    }

    .tela-card.confeccion {
      border-color: #e9d5ff;
    }

    .tela-nombre {
      font-size: 16px;
      font-weight: 700;
      color: #059669;
      margin-bottom: 12px;
    }

    .tela-detalles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .detalle-item {
      background: #f9fafb;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    .detalle-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .detalle-value {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }

    .observaciones {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-top: 16px;
      border: 2px dashed #d1fae5;
    }

    .observaciones.confeccion {
      border-color: #e9d5ff;
    }

    .observaciones-title {
      font-size: 14px;
      font-weight: 700;
      color: #0b3a73;
      margin-bottom: 8px;
    }

    .observaciones-text {
      font-size: 14px;
      color: #4b5563;
      line-height: 1.6;
      font-style: italic;
    }

    /* Tallas comparison */
    .tallas-comp-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 14px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #e2e8f0;
    }

    .tallas-comp-table th {
      background: linear-gradient(135deg, #0b3a73, #1e5a9e);
      color: white;
      padding: 10px 12px;
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .tallas-comp-table td {
      padding: 8px 12px;
      border-bottom: 1px solid #e2e8f0;
      text-align: center;
    }

    .tallas-comp-table .talla-nombre {
      font-weight: 700;
      text-align: left;
      color: #0b3a73;
    }

    .tallas-comp-table .diff-positiva { color: #16a34a; font-weight: 700; }
    .tallas-comp-table .diff-negativa { color: #dc2626; font-weight: 700; }
    .tallas-comp-table .diff-igual { color: #9ca3af; }
    .tallas-comp-table .cantidad-mod { color: #ea580c; font-weight: 700; }

    .tallas-comp-table .totales-row {
      background: #f1f5f9;
      font-weight: 700;
    }

    .tallas-comp-table .totales-row td {
      border-top: 2px solid #0b3a73;
    }

    .badge-cantidades-mod {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #fff7ed, #fed7aa);
      color: #ea580c;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid #fdba74;
      margin: 12px 0;
    }

    .meta-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: #f9fafb;
      border-radius: 8px;
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
    }

    .loading {
      text-align: center;
      padding: 60px;
      color: #64748b;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 16px;
      border-radius: 8px;
      margin: 20px;
    }

    /* Estilos del Acordeón */
    .accordion {
      background: white;
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .accordion-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      user-select: none;
    }

    .accordion-header:hover {
      background: #f9fafb;
    }

    .accordion-header.corte {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      border-left: 4px solid #10b981;
    }

    .accordion-header.corte:hover {
      background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
    }

    .accordion-header.confeccion {
      background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%);
      border-left: 4px solid #8b5cf6;
    }

    .accordion-header.confeccion:hover {
      background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%);
    }

    .accordion-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 700;
      color: #0b3a73;
    }

    .accordion-icon {
      font-size: 24px;
      transition: transform 0.3s ease;
    }

    .accordion-icon.open {
      transform: rotate(180deg);
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      padding: 0 24px;
    }

    .accordion-content.open {
      max-height: 2000px;
      padding: 0 24px 24px 24px;
    }

    .accordion-inner {
      padding-top: 20px;
    }

    @media (max-width: 768px) {
      .content {
        padding: 20px;
      }
      
      .header {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }
      
      .tela-detalles {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 Detalle de Actividad</h1>
      <button class="btn-volver" onclick="window.close()">← Volver</button>
    </div>

    <div id="content" class="content">
      <div class="loading">Cargando actividad...</div>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    let pedido = null;
    let prenda = null;

    // Obtener parámetros de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const pedidoId = urlParams.get('pedido');
    const prendaNombre = urlParams.get('prenda');

    if (!pedidoId) {
      mostrarError('No se especificó un pedido');
    } else {
      cargarDatos();
    }

    async function cargarDatos() {
      try {
        const token = localStorage.getItem('authToken');
        if (!token) {
          mostrarError('No hay sesión activa. Por favor inicia sesión.');
          return;
        }

        console.log('Cargando pedido ID:', pedidoId, 'Prenda:', prendaNombre);
        const url = `${API_BASE}/pedidos/${pedidoId}`;
        console.log('URL:', url);

        const res = await fetch(url, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        console.log('Response status:', res.status);

        if (!res.ok) {
          const errorText = await res.text();
          console.error('Error response:', errorText);
          throw new Error(`HTTP ${res.status}: ${errorText}`);
        }

        pedido = await res.json();
        console.log('Pedido cargado:', pedido);
        
        // Buscar la prenda específica
        let prendas = [];
        if (pedido.prendas) {
          prendas = typeof pedido.prendas === 'string' ? JSON.parse(pedido.prendas) : pedido.prendas;
        }
        console.log('Prendas:', prendas);

        prenda = prendas.find(p => p.tipoPrenda === prendaNombre);
        console.log('Prenda encontrada:', prenda);

        if (!prenda) {
          mostrarError('No se encontró la prenda especificada: ' + prendaNombre);
          return;
        }

        renderActividad();
      } catch (err) {
        console.error('Error completo:', err);
        mostrarError('Error al cargar los datos: ' + err.message);
      }
    }

    function renderActividad() {
      const container = document.getElementById('content');
      const tieneCorte = !!prenda.corte_datos;
      const tieneConfeccion = !!prenda.confeccion_datos;

      let html = `
        <!-- INFO DEL PEDIDO -->
        <div class="info-pedido">
          <div class="info-label">Pedido</div>
          <div class="info-value">${pedido.folio || '#' + pedido.id} - ${pedido.clienteNombre || 'Sin nombre'}</div>
          <div class="info-label">Prenda</div>
          <div class="info-value">${prenda.tipoPrenda}</div>
          <div class="info-label">Tallas</div>
          <div class="info-value">
            ${prenda.tallas ? prenda.tallas.map(t => `${t.talla}(${t.cantidad})`).join(', ') : 'Sin tallas'}
          </div>
        </div>
      `;

      // DATOS DE CORTE CON ACORDEÓN
      if (tieneCorte) {
        const corte = prenda.corte_datos;
        
        html += `
          <div class="accordion">
            <div class="accordion-header corte" onclick="toggleAccordion('corte')">
              <div class="accordion-title">
                <span>✂️</span>
                <span>Datos de Corte</span>
              </div>
              <div class="accordion-icon" id="icon-corte">▼</div>
            </div>
            <div class="accordion-content open" id="content-corte">
              <div class="accordion-inner">
                <div class="section-title">📏 Telas Utilizadas</div>
        `;

        if (corte.telas) {
          // Sistema nuevo: múltiples telas
          corte.telas.forEach((tela, idx) => {
            html += `
              <div class="tela-card">
                <div class="tela-nombre">📌 Tela ${idx + 1}: ${tela.tipoTela || '-'} - ${tela.color || '-'}</div>
                <div class="tela-detalles">
                  <div class="detalle-item">
                    <div class="detalle-label">Cantidad (kg)</div>
                    <div class="detalle-value">${tela.cantidadKg || 0} kg</div>
                  </div>
                  <div class="detalle-item">
                    <div class="detalle-label">Metraje</div>
                    <div class="detalle-value">${tela.cantidadMetros || 0} m</div>
                  </div>
                </div>
              </div>
            `;
          });
        } else {
          // Sistema viejo: una sola tela
          html += `
            <div class="tela-card">
              <div class="tela-nombre">📌 ${corte.tipoTela || '-'} - ${corte.color || '-'}</div>
              <div class="tela-detalles">
                <div class="detalle-item">
                  <div class="detalle-label">Cantidad (kg)</div>
                  <div class="detalle-value">${corte.cantidadKg || 0} kg</div>
                </div>
                <div class="detalle-item">
                  <div class="detalle-label">Metraje</div>
                  <div class="detalle-value">${corte.cantidadMetros || 0} m</div>
                </div>
              </div>
            </div>
          `;
        }

        html += `
                <div style="margin-top: 20px;">
                  <div class="detalle-item" style="display: inline-block; padding: 16px 24px;">
                    <div class="detalle-label">Piezas Cortadas</div>
                    <div class="detalle-value">✂️ ${corte.piezasCortadas || 0}</div>
                  </div>
                </div>
        `;

        // Mostrar comparación de tallas si fueron modificadas
        if (corte.tallasModificadas && corte.tallasCortadas) {
          html += `
            <div class="badge-cantidades-mod">⚠️ Corte ajustó las cantidades del pedido original</div>
            <table class="tallas-comp-table">
              <thead>
                <tr>
                  <th style="text-align:left;">Talla</th>
                  <th>Pedido Original</th>
                  <th>Cortadas</th>
                  <th>Diferencia</th>
                </tr>
              </thead>
              <tbody>
                ${corte.tallasCortadas.map((tc, idx) => {
                  const orig = corte.tallasOriginales?.[idx]?.cantidad || prenda.tallas?.[idx]?.cantidad || 0;
                  const cortada = tc.cantidad || 0;
                  const diff = cortada - orig;
                  return `
                    <tr>
                      <td class="talla-nombre">${tc.talla}</td>
                      <td>${orig}</td>
                      <td class="${diff !== 0 ? 'cantidad-mod' : ''}">${cortada}</td>
                      <td class="${diff > 0 ? 'diff-positiva' : diff < 0 ? 'diff-negativa' : 'diff-igual'}">
                        ${diff > 0 ? '+' + diff : diff === 0 ? '—' : diff}
                      </td>
                    </tr>
                  `;
                }).join('')}
                <tr class="totales-row">
                  <td class="talla-nombre">TOTAL</td>
                  <td>${corte.tallasOriginales ? corte.tallasOriginales.reduce((s,t) => s + (parseInt(t.cantidad)||0), 0) : 0}</td>
                  <td class="cantidad-mod">${corte.tallasCortadas.reduce((s,t) => s + (parseInt(t.cantidad)||0), 0)}</td>
                  <td class="${(() => { const d = corte.tallasCortadas.reduce((s,t) => s + (parseInt(t.cantidad)||0), 0) - (corte.tallasOriginales ? corte.tallasOriginales.reduce((s,t) => s + (parseInt(t.cantidad)||0), 0) : 0); return d > 0 ? 'diff-positiva' : d < 0 ? 'diff-negativa' : 'diff-igual'; })()}">
                    ${(() => { const d = corte.tallasCortadas.reduce((s,t) => s + (parseInt(t.cantidad)||0), 0) - (corte.tallasOriginales ? corte.tallasOriginales.reduce((s,t) => s + (parseInt(t.cantidad)||0), 0) : 0); return d > 0 ? '+'+d : d === 0 ? '—' : d; })()}
                  </td>
                </tr>
              </tbody>
            </table>
          `;
        }

        if (corte.observaciones) {
          html += `
            <div class="observaciones">
              <div class="observaciones-title">📝 Observaciones del Cortador</div>
              <div class="observaciones-text">${corte.observaciones}</div>
            </div>
          `;
        }

        html += `
                <div class="meta-info">
                  <div>🕒 Fecha: ${formatearFecha(corte.fecha)}</div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // DATOS DE CONFECCIÓN CON ACORDEÓN
      if (tieneConfeccion) {
        const conf = prenda.confeccion_datos;
        
        html += `
          <div class="accordion">
            <div class="accordion-header confeccion" onclick="toggleAccordion('confeccion')">
              <div class="accordion-title">
                <span>🧵</span>
                <span>Datos de Confección</span>
              </div>
              <div class="accordion-icon" id="icon-confeccion">▼</div>
            </div>
            <div class="accordion-content open" id="content-confeccion">
              <div class="accordion-inner">
                <div class="section-title">🧵 Información de Confección</div>
                
                <div class="tela-detalles">
                  <div class="detalle-item">
                    <div class="detalle-label">Piezas Recibidas</div>
                    <div class="detalle-value">📥 ${conf.piezasRecibidas || 0}</div>
                  </div>
                  <div class="detalle-item">
                    <div class="detalle-label">Piezas Terminadas</div>
                    <div class="detalle-value">✅ ${conf.piezasTerminadas || 0}</div>
                  </div>
                </div>

                ${conf.accesorios ? `
                  <div class="tela-card confeccion" style="margin-top: 16px;">
                    <div class="observaciones-title">🔘 Accesorios Utilizados</div>
                    <div style="font-size: 14px; color: #4b5563; margin-top: 8px;">${conf.accesorios}</div>
                  </div>
                ` : ''}

                ${conf.observaciones ? `
                  <div class="observaciones confeccion">
                    <div class="observaciones-title">💬 Observaciones de Confección</div>
                    <div class="observaciones-text">${conf.observaciones}</div>
                  </div>
                ` : ''}

                <div class="meta-info">
                  <div>🕒 Fecha: ${formatearFecha(conf.fecha)}</div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      if (!tieneCorte && !tieneConfeccion) {
        html += `
          <div class="error">
            Esta prenda no tiene datos de producción registrados.
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function formatearFecha(fecha) {
      if (!fecha) return 'N/A';
      const f = new Date(fecha);
      return f.toLocaleDateString('es-MX', { 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function toggleAccordion(id) {
      const content = document.getElementById(`content-${id}`);
      const icon = document.getElementById(`icon-${id}`);
      
      if (content.classList.contains('open')) {
        content.classList.remove('open');
        icon.classList.remove('open');
      } else {
        content.classList.add('open');
        icon.classList.add('open');
      }
    }

    function mostrarError(mensaje) {
      document.getElementById('content').innerHTML = `
        <div class="error">
          <strong>Error:</strong> ${mensaje}
        </div>
      `;
    }
  </script>
</body>
</html>
